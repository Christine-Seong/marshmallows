<title>Marshmallows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Momo+Trust+Sans:wght@300..700&family=Mynerve&display=swap">
<style>
/* Layout: phone app shell. Every screen = header (56px) / content / bottom dock, 20px side margins, left-aligned text, 8px spacing grid. Single committed park look. */
:root {
  --forest: #19473f;
  --pine: #1b6151;
  --sky: #9dc0d1;
  --sage: #a9c899;
  --cream: #f9f9f5;
  --ink: #17402f;
  --ink-2: #4c6b60;
  --line: rgba(23, 64, 47, .12);
  --scrim: rgba(12, 36, 30, .5);
  --env-back: #e3e8d6;
  --env-front: #f2f3ea;
  --env-flap: #d6e2c8;
  --display: "Lexend", "Neulis Neue", "Avenir Next", system-ui, sans-serif; /* stand-in for Neulis Neue */
  --sans: "Momo Trust Sans", "Avenir Next", system-ui, sans-serif;
  --hand: "Mynerve", "Bradley Hand", "Segoe Print", cursive;
  --m: 24px;          /* side margin */
  --r: 16px;          /* card radius */
  --shadow: 0 8px 24px rgba(10, 40, 33, .18);
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--forest); color: var(--ink); font-family: var(--sans); display: grid; place-items: center; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

.app { position: relative; width: min(100%, 430px); height: min(100%, 900px); overflow: hidden; background: var(--pine); isolation: isolate; container-type: size; }
@media (min-width: 560px) and (min-height: 700px) {
  .app { border-radius: 44px; box-shadow: 0 30px 80px rgba(0,0,0,.35), 0 0 0 10px #0f2d27; height: min(calc(100% - 48px), 874px); --sb: 50px; --hb: 16px; }
  .app .statusbar, .app .homebar { display: flex; }
}
:where(.app) { --sb: 0px; --hb: 0px; }
.statusbar { display: none; position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 90; align-items: center; justify-content: space-between; padding: 4px 30px 0 36px; font: 600 15px/1 -apple-system, "SF Pro Text", system-ui, sans-serif; color: var(--cream); pointer-events: none; transition: color .3s; }
.statusbar svg { height: 12px; width: auto; margin-left: 6px; }
.homebar { display: none; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--cream); z-index: 90; pointer-events: none; transition: background .3s; }
.app[data-tone="dark"] .statusbar { color: var(--forest); }
.app[data-tone="dark"] .homebar { background: var(--forest); }

/* screens */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: var(--sb); padding-bottom: var(--hb); opacity: 0; visibility: hidden; transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1), visibility 0s linear .45s; }
.screen.on { opacity: 1; visibility: visible; transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1); }
.bg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: -2; }
.scrim-top { position: absolute; left: 0; right: 0; top: 0; height: 140px; background: linear-gradient(180deg, rgba(12,36,30,.45), rgba(12,36,30,0)); z-index: -1; pointer-events: none; }
.scrim-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(0deg, rgba(12,36,30,.6), rgba(12,36,30,0)); z-index: -1; pointer-events: none; }

/* type scale: 28 / 20 / 17 / 15 / 13 / 11 */
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.t-title { font-family: var(--display); font-weight: 500; font-size: 20px; line-height: 1.2; }
.t-body { font-size: 15px; line-height: 1.5; }
.t-small { font-size: 13px; line-height: 1.4; }

/* header */
.nav { flex: none; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 calc(var(--m) - 10px); color: var(--cream); position: relative; z-index: 10; }
.nav-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-title .t-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav.dark { color: var(--forest); }
.nav-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: inherit; transition: background .2s; }
.nav-btn:active { background: rgba(255,255,255,.18); }
.nav-btn svg { width: 24px; height: 24px; }
.nav-btn.fill { background: rgba(249,249,245,.18); backdrop-filter: blur(8px); }
.nav.dark .nav-btn.fill { background: rgba(25,71,63,.08); }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 24px; border-radius: 14px; font-family: var(--display); font-size: 16px; font-weight: 500; width: 100%; transition: transform .15s, opacity .2s; }
.btn:active { transform: scale(.98); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--cream); color: var(--forest); }
.btn.dark { background: var(--forest); color: var(--cream); }
.btn.ghost { background: rgba(25,71,63,.08); color: var(--forest); }

/* ---------- Home ---------- */
#home { color: var(--forest); overflow: hidden;
  background:
    radial-gradient(120% 60% at 85% 0%, rgba(157,192,209,.45), rgba(157,192,209,0) 60%),
    radial-gradient(110% 55% at 10% 100%, rgba(169,200,153,.45), rgba(169,200,153,0) 60%),
    var(--cream); }
.puffs { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.puffs i { position: absolute; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, rgba(255,255,255,0) 68%); filter: blur(6px); animation: puff var(--d, 38s) ease-in-out infinite alternate; }
@keyframes puff { from { transform: translate(0, 0) scale(1); } to { transform: translate(var(--x, 30px), var(--y, -20px)) scale(1.08); } }
#home .home-top, #home .home-main { position: relative; z-index: 1; }
.home-top { flex: none; height: 56px; margin-top: 12px; padding: 0 var(--m); display: flex; align-items: center; justify-content: space-between; }
.avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: var(--env-flap); color: var(--pine); display: block; transition: transform .15s; }
.avatar svg { display: block; width: 36px; height: 36px; }
.avatar:active, .gear:active { transform: scale(.94); }
.gear { width: 44px; height: 44px; margin-right: -11px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); transition: transform .15s; }
.gear svg { width: 21px; height: 21px; }
/* rhythm: greeting + weather sit close as one group (16), groups are 2x apart (32); spare height goes mostly to the card, the rest splits evenly above and below */
.home-main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 var(--m) 8px; }
.sp { flex: 1 1 24px; }
.sp.end { flex-basis: 32px; flex-grow: 1.3; }
.gap-s { flex: none; height: 16px; }
.gap-l { flex: none; height: 32px; }
.greet { display: flex; flex-direction: column; gap: 4px; }
.greet .date { font-size: 13px; color: var(--ink-2); opacity: .8; }
.hello { font-family: var(--display); font-weight: 500; font-size: 34px; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }

/* weather */
.weather { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 22px; color: var(--forest);
  background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.w-now { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.w-temp { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1; }
.w-temp svg { width: 26px; height: 26px; color: var(--pine); }
.w-stats { display: grid; grid-template-columns: auto auto; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.w-stats span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.w-stats svg { width: 13px; height: 13px; }
.w-days { display: grid; grid-template-columns: repeat(4, 34px); gap: 4px; text-align: center; }
.w-day { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); }
.w-day b { font-weight: 600; font-size: 10px; letter-spacing: .06em; }
.w-day svg { width: 20px; height: 20px; color: var(--pine); }
.w-day span { display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.w-day span i { font-style: normal; opacity: .65; }

/* the park through a slow-moving lens */
.invite { flex: none; display: flex; flex-direction: column; align-items: center; gap: 24px; padding-top: 28px; text-align: center; }
.lens { position: relative; width: min(68cqw, 280px); aspect-ratio: 1; }
.lens-glass { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; isolation: isolate; box-shadow: 0 0 0 8px rgba(255,255,255,.55), 0 24px 50px rgba(25,71,63,.16); }
.feel-map { position: absolute; z-index: -1; left: 0; top: 0; width: 220%; height: 220%; background: url(assets/birdseye.jpg) center / cover; animation: roam 40s ease-in-out infinite; will-change: transform; }
.lens-glass::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.22), rgba(255,255,255,0) 45%), radial-gradient(circle, rgba(12,36,30,0) 60%, rgba(12,36,30,.18)); }
.lens::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 1px solid rgba(27,97,81,.18); animation: breathe 8s ease-in-out infinite; }
.lens::after { content: ""; position: absolute; inset: -28px; border-radius: 50%; border: 1px solid rgba(27,97,81,.09); animation: breathe 8s ease-in-out -1.2s infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.97); opacity: .6; } 50% { transform: scale(1.03); opacity: 1; } }
.invite h2 { margin-top: 20px; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.25; color: var(--forest); text-wrap: balance; }
.invite .btn { width: auto; height: 48px; padding: 0 44px; border-radius: 999px; font-size: 15px; background: var(--forest); color: var(--cream); box-shadow: 0 10px 24px rgba(25,71,63,.22); }
@keyframes roam {
  0%   { transform: translate(-10%, -6%); }
  20%  { transform: translate(-50%, -14%); }
  40%  { transform: translate(-52%, -48%); }
  60%  { transform: translate(-22%, -54%); }
  80%  { transform: translate(-6%, -32%); }
  100% { transform: translate(-10%, -6%); }
}

/* ---------- Map ---------- */
#map .scrim-top { z-index: 1; height: 190px; }
.map-layer { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.map-layer .bg { z-index: 0; background-image: url(assets/birdseye.jpg); }
.spotlight { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity .45s; background: radial-gradient(circle at var(--sx, 50%) var(--sy, 50%), rgba(12,36,30,0) 0 56px, rgba(12,36,30,.5) 150px); }
.map-layer.focus .spotlight { opacity: 1; }
.spots { position: absolute; inset: 0; z-index: 2; }

/* tabs */
.tabs { flex: none; position: relative; z-index: 6; margin: 4px var(--m) 0; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; height: 44px; border-radius: 14px; background: rgba(12,36,30,.38); backdrop-filter: blur(12px); }
.tabs button { border-radius: 10px; color: var(--cream); font-family: var(--display); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .25s, color .25s; }
.tabs button svg { width: 16px; height: 16px; }
.tabs button[aria-selected="true"] { background: var(--cream); color: var(--forest); }

/* markers */
.node { position: absolute; transform: translate(-50%, -50%); width: 48px; height: 48px; display: grid; place-items: center; animation: nodein .45s cubic-bezier(.2,1.3,.4,1) both; }
.node .core { position: relative; z-index: 2; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--cream); color: var(--forest); box-shadow: 0 4px 14px rgba(10,40,33,.28); transition: background .25s, color .25s, transform .3s cubic-bezier(.2,1.4,.4,1); }
.node .core svg { width: 20px; height: 20px; }
.node .ring { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 1.5px solid rgba(249,249,245,.8); opacity: 0; animation: wave var(--rate, 3.4s) ease-out infinite; }
.node .ring + .ring { animation-delay: calc(var(--rate, 3.4s) / -2); }
.node.live .ring { --rate: 1.5s; border-width: 2px; border-color: var(--cream); }
.node.kit .core { background: #ffe9a8; }
.node.sel .core { background: var(--forest); color: var(--cream); transform: scale(1.15); }
.node .tag { position: absolute; z-index: 3; bottom: calc(100% + 6px); left: 50%; transform: translate(-50%, 6px); white-space: nowrap; background: var(--cream); color: var(--forest); font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 999px; box-shadow: 0 4px 12px rgba(10,40,33,.2); opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s; }
.node.sel .tag { opacity: 1; transform: translate(-50%, 0); }

/* bottom area */
.map-foot { margin-top: auto; position: relative; z-index: 6; padding-bottom: 24px; display: flex; flex-direction: column; gap: 10px; }
.map-card { margin: 0 var(--m); display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 22px; background: rgba(249,249,245,.95); backdrop-filter: blur(12px); box-shadow: var(--shadow); color: var(--forest); animation: rise .35s ease both; }
.map-card-row { display: flex; align-items: center; gap: 12px; }
.map-card-row > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.map-card .eyebrow { color: var(--pine); }
.map-card b { font-family: var(--display); font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map-card .sub { font-size: 13px; color: var(--ink-2); }
.mini { flex: none; height: 40px; padding: 0 14px; border-radius: 12px; background: var(--forest); color: var(--cream); font-size: 14px; font-family: var(--display); display: inline-flex; align-items: center; gap: 6px; }
.mini svg { width: 16px; height: 16px; }
.mini.ghost { background: rgba(25,71,63,.08); color: var(--forest); }
.pplay { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--forest); color: var(--cream); display: grid; place-items: center; }
.pplay svg { width: 20px; height: 20px; }
.map-card .bars i { background: var(--pine); }
.map-card .eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map-card .pv { display: inline-flex; align-items: center; gap: 8px; }
.map-card .pv .bars { height: 14px; gap: 2px; }
.map-card .pv .bars i { width: 2px; height: 4px; }
.map-card.on .pv .bars i { animation-name: eqs; }
@keyframes eqs { 0%, 100% { height: 4px; } 50% { height: 14px; } }
.map-card.on .bars i { animation: eq 1.1s ease-in-out infinite; }
.progress { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 6px; }
.progress i { height: 4px; border-radius: 2px; background: var(--line); transition: background .4s; }
.progress i.done { background: var(--pine); }

/* info carousel */
.disc { margin: 0 var(--m); display: flex; align-items: center; justify-content: space-between; color: var(--cream); font-size: 13px; text-shadow: 0 1px 6px rgba(0,0,0,.3); }
.disc .progress { width: 96px; }
.disc .progress i { background: rgba(249,249,245,.35); }
.disc .progress i.done { background: var(--cream); }
.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--m); padding: 4px var(--m) 8px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.icard { flex: 0 0 82%; scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 22px; background: rgba(249,249,245,.96); box-shadow: var(--shadow); color: var(--ink); text-align: left; transition: opacity .3s, transform .3s; }
.icard:last-child { margin-right: var(--m); }
.icard:not(.cur) { opacity: .65; transform: scale(.97); }
.icard .cat { display: flex; align-items: center; gap: 8px; }
.icard .cat i { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--forest); color: var(--cream); }
.icard .cat i svg { width: 15px; height: 15px; }
.icard .cat .eyebrow { color: var(--pine); flex: 1; }
.icard .cat small { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.icard .cat small svg { width: 13px; height: 13px; color: var(--pine); }
.icard h3 { font-family: var(--display); font-weight: 500; font-size: 17px; color: var(--forest); }
.icard p { font-size: 14px; line-height: 1.5; }

/* drawer (hamburger menu) */
.drawer { position: absolute; inset: 0; z-index: 60; visibility: hidden; transition: visibility 0s .4s; }
.drawer.on { visibility: visible; transition: none; }
.drawer .shade { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .35s; }
.drawer.on .shade { opacity: 1; }
.drawer-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(84%, 320px); background: var(--cream); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .4s cubic-bezier(.2,.9,.25,1); box-shadow: -10px 0 30px rgba(0,0,0,.2); }
.drawer.on .drawer-panel { transform: none; }
.drawer-head { height: 60px; margin-top: var(--sb); display: flex; align-items: center; justify-content: space-between; padding: 0 calc(var(--m) - 10px) 0 var(--m); color: var(--forest); }
.drawer-head .eyebrow { color: var(--pine); }
.menu { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.menu-sep { height: 1px; background: var(--line); margin: 8px 8px; }
.m-item { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 14px; text-align: left; transition: background .2s; }
.m-item:active { background: rgba(25,71,63,.06); }
.m-item[aria-current="true"] { background: rgba(169,200,153,.3); }
.m-ico { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--cream); }
.m-ico svg { width: 20px; height: 20px; }
.m-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.m-txt b { font-family: var(--display); font-weight: 500; font-size: 15px; color: var(--forest); }
.m-txt small { font-size: 12px; color: var(--ink-2); }
.m-item > svg { width: 18px; height: 18px; color: var(--ink-2); opacity: .6; }
.drawer-foot { padding: 16px var(--m) calc(24px + var(--hb)); font-size: 11px; color: var(--ink-2); border-top: 1px solid var(--line); line-height: 1.5; }

/* bottom sheet */
.sheet-wrap { position: absolute; inset: 0; z-index: 55; visibility: hidden; transition: visibility 0s .35s; }
.sheet-wrap.on { visibility: visible; transition: none; }
.sheet-wrap .shade { position: absolute; inset: 0; background: rgba(12,36,30,.3); opacity: 0; transition: opacity .3s; }
.sheet-wrap.on .shade { opacity: 1; }
.sheet { position: absolute; left: 10px; right: 10px; bottom: calc(10px + var(--hb)); background: var(--cream); border-radius: 28px; padding: 12px var(--m) var(--m); display: flex; flex-direction: column; gap: 8px; transform: translateY(110%); transition: transform .35s cubic-bezier(.2,.9,.25,1); box-shadow: var(--shadow); }
.sheet-wrap.on .sheet { transform: none; }
.sheet .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; margin-bottom: 8px; }
.sheet .eyebrow { color: var(--pine); }
.sheet .t-title { color: var(--forest); }
.sheet .t-body { color: var(--ink); margin-bottom: 12px; }

/* ---------- Sound ---------- */
#sound .bg { background-image: url(assets/grass.jpg); }
#sound .tint { position: absolute; inset: 0; z-index: -1; transition: background .6s; }
.questions { flex: 1; position: relative; min-height: 0; }
.fq { position: absolute; left: var(--x); top: var(--y); max-width: var(--w, 58%); text-align: left; color: var(--cream); font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.35; text-shadow: 0 1px 8px rgba(0,0,0,.25); opacity: .78; transition: opacity .3s; animation: float var(--d, 14s) ease-in-out var(--delay, 0s) infinite; }
.fq:hover, .fq.picked { opacity: 1; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.questions.has-pick .fq:not(.picked) { opacity: .4; }

.dock { flex: none; padding: 0 var(--m) 20px; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 6; }
.player { display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 10px; border-radius: 20px; background: rgba(12,36,30,.38); backdrop-filter: blur(12px); color: var(--cream); }
.play { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--cream); color: var(--forest); }
.play svg { width: 22px; height: 22px; }
.player-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.player-txt b { font-family: var(--display); font-weight: 500; font-size: 15px; }
.player-txt small { font-size: 12px; opacity: .75; }
.bars { flex: none; display: flex; align-items: center; gap: 3px; height: 24px; }
.bars i { display: block; width: 3px; height: 6px; border-radius: 2px; background: var(--cream); opacity: .7; }
.player.on .bars i { animation: eq 1.1s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: -.3s !important; } .bars i:nth-child(3) { animation-delay: -.6s !important; } .bars i:nth-child(4) { animation-delay: -.15s !important; } .bars i:nth-child(5) { animation-delay: -.45s !important; }

.dm { display: flex; flex-direction: column; gap: 8px; }
.dm-reply { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--cream); opacity: .9; padding-left: 16px; }
.dm-reply span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dm-reply button { width: 24px; height: 24px; display: grid; place-items: center; }
.dm-reply button svg { width: 14px; height: 14px; }
.dm-row { display: flex; align-items: flex-end; gap: 8px; min-height: 52px; background: var(--cream); border-radius: 26px; padding: 6px 6px 6px 18px; }
.dm-row textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; font: 15px/1.4 var(--sans); color: var(--ink); padding: 10px 0; max-height: 100px; }
.dm-row textarea::placeholder { color: var(--ink-2); opacity: .7; }
.send { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--forest); color: var(--cream); display: grid; place-items: center; }
.send svg { width: 18px; height: 18px; }

/* ---------- Reflection ---------- */
#reflect .bg { transition: background-image .4s; }
.photo-btn { position: relative; overflow: hidden; }
.photo-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 8px var(--m); }
.paper-box { width: min(84cqw, 340px, calc((100cqh - 340px) * .784)); display: flex; flex-direction: column; gap: 16px; }
.paper { position: relative; width: 100%; aspect-ratio: 534 / 681; background: url(assets/paper.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 12px 24px rgba(0,0,0,.3)); }
.paper-inner { position: absolute; inset: 10% 11% 9% 11%; display: flex; flex-direction: column; gap: 12px; }
.paper-q { font-size: 12px; line-height: 1.4; color: var(--ink-2); padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.paper-q:empty { display: none; }
.paper textarea { flex: 1; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); line-height: 1.55; padding: 0; }
.paper textarea::placeholder { color: var(--ink-2); opacity: .55; }
.hand { font-family: var(--hand); font-size: 19px; }
.sans { font-family: var(--sans); font-size: 16px; }
.paper canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; pointer-events: none; }
.paper.drawing canvas { pointer-events: auto; cursor: crosshair; }
.paper.drawing textarea { pointer-events: none; }

.tooldock { background: rgba(12,36,30,.45); backdrop-filter: blur(14px); border-radius: 22px; padding: 10px; display: flex; flex-direction: column; gap: 10px; color: var(--cream); }
.ctx { height: 36px; display: flex; align-items: center; }
.seg { flex: 1; display: grid; grid-template-columns: 1fr 1fr; background: rgba(255,255,255,.12); border-radius: 12px; padding: 3px; height: 36px; }
.seg button { border-radius: 9px; font-size: 14px; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--cream); color: var(--forest); }
.seg .hand { font-size: 16px; }
.swatches { flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
.swatch[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--cream), 0 0 0 2px var(--cream); }
.clear { margin-left: auto; font-size: 13px; padding: 0 12px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.12); }
.tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tool { height: 44px; display: grid; place-items: center; border-radius: 12px; transition: background .2s; }
.tool svg { width: 24px; height: 24px; }
.tool[aria-pressed="true"] { background: rgba(249,249,245,.2); }
.ttool { font-family: Georgia, "Times New Roman", serif; font-size: 17px; width: 24px; height: 24px; border: 1.6px solid currentColor; border-radius: 4px; display: grid; place-items: center; line-height: 1; }
#reflect.sending .tooldock, #reflect.sending .nav, #reflect.sending .upload { opacity: 0; pointer-events: none; transition: opacity .3s; }

/* ---------- Envelope ---------- */
.env { position: relative; width: var(--w, 140px); aspect-ratio: 1.5; perspective: 700px; }
.env > div { position: absolute; }
.env-back { inset: 0; background: var(--env-back); border-radius: 6px; box-shadow: 0 8px 20px rgba(10,40,33,.2); }
.env-letter { left: 7%; right: 7%; top: 6%; height: 84%; transition: transform .6s cubic-bezier(.3,.8,.3,1); z-index: 2; }
.env-front { inset: 0; background: var(--env-front); border-radius: 0 0 6px 6px; clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); z-index: 3; }
.env-flap { left: 0; right: 0; top: 0; height: 60%; background: var(--env-flap); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: 50% 0; transition: transform .55s ease, z-index 0s .27s; z-index: 4; border-radius: 6px 6px 0 0; }
.env.open .env-flap { transform: rotateX(178deg); z-index: 1; }
.env-seal { left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: var(--pine); z-index: 5; display: grid; place-items: center; color: var(--cream); transition: transform .3s cubic-bezier(.2,1.6,.4,1), opacity .2s; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
.env-seal svg { width: 55%; height: 55%; }
.env.open .env-seal { transform: translate(-50%, -50%) scale(0); opacity: 0; }
.env-label { left: 8%; right: 8%; bottom: 8%; z-index: 5; display: flex; justify-content: space-between; gap: 6px; font-size: 10px; color: var(--ink-2); }
.env-label span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fly { position: absolute; z-index: 30; transform: translate(-50%, -50%); opacity: 0; transition: opacity .25s; pointer-events: none; }
.fly.show { opacity: 1; }

.env-letter::before, .fold-top .back::before { content: ""; position: absolute; inset: 0; background: url(assets/paper.webp) top / 100% 200% no-repeat; transform: scaleY(-1); }
.env-letter::after { content: ""; position: absolute; left: 4%; right: 4%; top: 0; height: 14%; background: linear-gradient(180deg, rgba(23,64,47,.12), rgba(23,64,47,0)); }
.fold-rig { position: absolute; z-index: 31; perspective: 1400px; transform-origin: 0 0; pointer-events: none; }
.fold-rig .paper { filter: none; }
.fold-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; overflow: hidden; filter: drop-shadow(0 10px 18px rgba(0,0,0,.28)); }
.fold-top { position: absolute; left: 0; right: 0; top: 0; height: 50%; transform-origin: 50% 100%; transform-style: preserve-3d; }
.fold-top .face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.fold-top .back { transform: rotateX(180deg); }
.fold-top .shade { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.fold-top .front .shade { background: linear-gradient(0deg, rgba(20,45,35,.35), rgba(20,45,35,.05)); }
.fold-top .back .shade { background: linear-gradient(180deg, rgba(20,45,35,.3), rgba(20,45,35,0)); opacity: 1; }

/* ---------- Archive ---------- */
#archive { background: linear-gradient(180deg, var(--sky) 0%, #c9dcd9 50%, #d7e5c9 80%, var(--sage) 100%); }
#archive .cloud { position: absolute; background: rgba(255,255,255,.5); border-radius: 999px; filter: blur(8px); animation: drift 30s linear infinite alternate; z-index: -1; }
.arch-sub { flex: none; padding: 4px var(--m) 8px; color: var(--ink-2); font-size: 13px; }
.sky { flex: 1; min-height: 0; overflow-y: auto; padding: 28px var(--m) 64px; }
.env-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; row-gap: 36px; }

.float-env { display: flex; flex-direction: column; align-items: stretch; gap: 12px; animation: bob var(--d, 6s) ease-in-out var(--delay, 0s) infinite; }
.float-env .env { --w: 100%; }

.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-top: 24px; color: var(--forest); }

.reader { position: absolute; inset: 0; z-index: 40; display: none; }

.env-stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); transition: opacity .3s; }

.letter-view { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: var(--sb); opacity: 0; transition: opacity .5s; pointer-events: none; }

.letter-text { flex: 1; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); line-height: 1.55; }

.toast { position: absolute; left: var(--m); right: var(--m); top: calc(var(--sb) + 68px); z-index: 70; background: var(--forest); color: var(--cream); padding: 12px 16px; border-radius: 14px; font-size: 13px; opacity: 0; transform: translateY(-8px); transition: opacity .3s, transform .3s; pointer-events: none; }

@keyframes float { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(var(--dx), calc(var(--dy) * -1)); } 50% { transform: translate(calc(var(--dx) * .3), var(--dy)); } 75% { transform: translate(calc(var(--dx) * -1), calc(var(--dy) * -.4)); } }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
@keyframes eq { 0%, 100% { height: 6px; } 50% { height: 22px; } }
@keyframes wave { from { transform: scale(1); opacity: .85; } to { transform: scale(var(--amp, 2.4)); opacity: 0; } }
@keyframes nodein { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -90%) scale(.9); } to { opacity: 1; transform: translate(-50%, -100%) scale(1); } }

@keyframes unfold { from { opacity: 0; transform: scale(.5) rotateX(40deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const app = $('#app');

/* ---------- Content ---------- */
const SPOTS = [
  { id: 'grass', name: 'On the grass', x: 66, y: 27, tint: 'linear-gradient(180deg, rgba(0,0,0,0), rgba(16,44,37,.2))', soundName: 'Sounds of the grass',
    sound: { rustle: .5, birds: .4, wind: .15 },
    questions: ['Pay attention to the sounds around you.', 'Can you hear something similar?', 'When did you last sit on the ground?', 'What does the grass feel like under your hands?', 'What can you put down for a while?'],
    fact: { q: 'Why does the lawn feel so quiet?', a: 'The terrace is a flat ledge on the side of College Hill. The slope below carries most of the street noise away, so up here the lawn stays soft and still.' } },
  { id: 'view', name: 'In front of the view', x: 28, y: 28, tint: 'linear-gradient(180deg, rgba(157,192,209,.5), rgba(157,192,209,0) 55%)', soundName: 'Wind over the city',
    sound: { wind: .7, city: .35, birds: .1 },
    questions: ['How far can you see from here?', 'Can you hear the city breathing?', 'What looks small from up here?', 'Which worry feels smaller from this height?', 'Where were you at this time yesterday?'],
    fact: { q: 'What am I looking at?', a: 'Downtown Providence, with the white marble dome of the Rhode Island State House across the valley. People come to this railing for the sunset over the skyline.' } },
  { id: 'bench', name: 'On the bench', x: 40, y: 52, tint: 'linear-gradient(180deg, rgba(27,97,81,.3), rgba(27,97,81,.1))', soundName: 'Birds near the bench',
    sound: { birds: .6, rustle: .2, city: .12 },
    questions: ['Who sat here before you?', 'What are you carrying today?', 'How slowly can you breathe?', 'What would you tell yourself from this morning?', 'What do you hear first, near or far?'],
    fact: { q: 'Who visits the terrace?', a: 'Students from the hill, neighbors walking dogs, and people who stop on their way down Congdon Street. Most of them sit facing the same direction: the view.' } },
  { id: 'trees', name: 'Under the trees', x: 68, y: 70, tint: 'linear-gradient(180deg, rgba(25,71,63,.45), rgba(25,71,63,.2))', soundName: 'Leaves in the wind',
    sound: { leaves: .65, birds: .45, wind: .2 },
    questions: ['Can you hear the wind in the leaves?', 'How old do you think these trees are?', 'What does shade sound like?', 'What has been growing in you lately?', 'Which sound is the farthest away?'],
    fact: { q: 'How is the plant life?', a: 'Open lawn ringed by old shade trees. Step from the sun into the shade and notice how the sound changes along with the light.' } },
];
const INFO = [
  { id: 'statue', x: 18, y: 60, icon: 'i-statue', cat: 'History', label: 'The statue', q: 'What is this statue?', a: 'The Roger Williams Monument. Williams founded Providence in 1636, and his granite figure has looked out over the city from this terrace since 1939.' },
  { id: 'view', x: 30, y: 30, icon: 'i-eye', cat: 'The view', label: 'The view', q: 'What am I looking at?', a: SPOTS[1].fact.a },
  { id: 'plants', x: 74, y: 36, icon: 'i-leaf', cat: 'Nature', label: 'Plant life', q: 'How is the plant life?', a: SPOTS[3].fact.a },
  { id: 'terrace', x: 50, y: 42, icon: 'i-hill', cat: 'Landscape', label: 'The terrace', q: 'Why is it a terrace?', a: SPOTS[0].fact.a },
  { id: 'kit', x: 44, y: 58, icon: 'i-box', cat: 'Park kit', label: 'Park kit', q: 'Where is the park kit?', a: 'Look for the green box beside the bench. Inside: the activity guide, information cards and meditation cards. Take what you need, and put it back for the next person.', kit: true },
];
// how far each spot's sound carries on the map (ring size) and how fast it pulses
const REACH = { grass: [2.1, 3.8], view: [3.1, 2.6], bench: [1.7, 4.4], trees: [2.6, 3.2] };
const FREE_PROMPTS = ['What did you notice first when you got here?', 'What are you leaving behind today?', 'What is one sound you want to remember?'];
const INKS = ['#19473f', '#1b6151', '#5f8fa8', '#7ba567', '#2b2b28', '#e9a9b4'];

/* ---------- State ---------- */
let mode = 'sound', currentSpot = null, pickedQ = '', letters = [], justAdded = null, returnTo = 'map';
let heard = new Set();
try { heard = new Set(JSON.parse(localStorage.getItem('mm-heard') || '[]')); } catch (e) {}
let found = new Set();
try { found = new Set(JSON.parse(localStorage.getItem('mm-found') || '[]')); } catch (e) {}
let selSpot = null, previewing = false, infoIdx = 0;

/* ---------- Navigation ---------- */
function show(id, back, plain) {
  const next = document.getElementById(id), prev = $('.screen.on');
  show.current = id;
  if (prev && prev !== next && !plain) {
    next.style.transition = 'none';
    next.style.transform = `translateX(${back ? -32 : 32}px)`;
    next.offsetWidth;
    next.style.transition = '';
    next.style.transform = '';
    prev.style.transform = `translateX(${back ? 32 : -32}px)`;
  }
  app.dataset.tone = id === 'archive' || id === 'home' ? 'dark' : '';
  $$('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  if (id !== 'sound') { sound.stop(); setPlaying(false); previewing = false; }
}
function goMap(m, back, plain) { if (m) mode = m; show('map', back, plain); renderMap(); }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

$('#startBtn').onclick = () => goMap('sound');

const writeFree = origin => { currentSpot = null; openReflection('', FREE_PROMPTS[Math.floor(Math.random() * FREE_PROMPTS.length)], origin); };
$('#mapHome').onclick = () => show('home', true);

/* hamburger menu */
const drawer = $('#drawer');
function setDrawer(open) {
  drawer.classList.toggle('on', open);
  app.dataset.tone = open || show.current === 'archive' || show.current === 'home' ? 'dark' : '';
  const cur = $('#archive').classList.contains('on') ? 'thoughts' : mode === 'info' ? (INFO[infoIdx].kit ? 'kit' : 'about') : mode;
  $$('.m-item').forEach(b => b.setAttribute('aria-current', b.dataset.go === cur));
}
$$('[data-menu]').forEach(b => b.onclick = () => setDrawer(true));
$$('[data-close-drawer]').forEach(b => b.onclick = () => setDrawer(false));
$$('.m-item').forEach(b => b.onclick = () => {
  const g = b.dataset.go; setDrawer(false);
  if (g === 'thoughts') openArchive();
  else if (g === 'write') writeFree(show.current);
  else if (g === 'kit') { infoIdx = INFO.findIndex(x => x.kit); goMap('info'); }
  else goMap(g === 'about' ? 'info' : 'sound');
});

/* bottom sheet */
const sheetWrap = $('#sheetWrap');
function openSheet({ eyebrow, title, body, action = 'Close', onAction }) {
  $('#sheetEyebrow').textContent = eyebrow; $('#sheetTitle').textContent = title; $('#sheetBody').textContent = body;
  const a = $('#sheetAction'); a.textContent = action;
  a.onclick = () => { closeSheet(); onAction && onAction(); };
  sheetWrap.classList.add('on');
}
function closeSheet() { sheetWrap.classList.remove('on'); }
$$('[data-close-sheet]').forEach(b => b.onclick = closeSheet);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (sheetWrap.classList.contains('on')) closeSheet();
  else if (drawer.classList.contains('on')) setDrawer(false);
  else if ($('#reader').classList.contains('on')) closeLetter();
});

function updateCounts() {
  $('#ms-thoughts').textContent = letters.length ? `${letters.length} letter${letters.length > 1 ? 's' : ''} kept` : 'No letters yet';
}

/* ---------- Map ---------- */
const layer = $('#mapLayer'), spotsBox = $('#spots'), foot = $('#mapFoot');
$$('.tabs button').forEach(b => b.onclick = () => { if (mode !== b.dataset.tab) { mode = b.dataset.tab; renderMap(); } });
spotsBox.addEventListener('click', e => { if (e.target === spotsBox && mode === 'sound') selectSpot(null); });

function nodeEl(x, y, icon, tag) {
  const b = document.createElement('button');
  b.className = 'node'; b.style.left = x + '%'; b.style.top = y + '%';
  b.innerHTML = `<span class="core"><svg><use href="#${icon}"/></svg></span><span class="tag"></span>`;
  b.querySelector('.tag').textContent = tag; b.setAttribute('aria-label', tag);
  return b;
}
function spotlight(x, y) {
  if (x == null) { layer.classList.remove('focus'); return; }
  layer.style.setProperty('--sx', x + '%'); layer.style.setProperty('--sy', y + '%');
  layer.classList.add('focus');
}
function renderMap() {
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === mode));
  spotsBox.innerHTML = '';
  if (mode === 'sound') {
    SPOTS.forEach((s, i) => {
      const n = nodeEl(s.x, s.y, 'i-sound', s.name);
      n.dataset.id = s.id;
      n.insertAdjacentHTML('afterbegin', '<span class="ring"></span><span class="ring"></span>');
      n.style.setProperty('--amp', REACH[s.id][0]); n.style.setProperty('--rate', REACH[s.id][1] + 's');
      n.style.animationDelay = i * 70 + 'ms';
      n.onclick = () => selSpot === s ? goListen(s) : selectSpot(s, true);
      spotsBox.append(n);
    });
    selectSpot(selSpot, false);
  } else {
    sound.stop(); previewing = false;
    INFO.forEach((it, i) => {
      const n = nodeEl(it.x, it.y, it.icon, it.label);
      n.dataset.i = i; if (it.kit) n.classList.add('kit');
      n.style.animationDelay = i * 70 + 'ms';
      n.onclick = () => selectInfo(i, true);
      spotsBox.append(n);
    });
    renderInfoFoot();
    selectInfo(infoIdx, true, true);
  }
  updateCounts();
}

/* sound map: tap = preview in place, tap again or "Listen" = zoom in */
function selectSpot(s, play) {
  selSpot = s;
  $$('.node[data-id]').forEach(n => n.classList.toggle('sel', !!s && n.dataset.id === s.id));
  spotlight(s ? s.x : null, s ? s.y : null);
  if (play && s) { sound.play(s.sound); previewing = true; addHeard(s.id); }
  if (!s) { sound.stop(); previewing = false; }
  renderSoundFoot();
}
function setPreview(on) {
  if (on) { sound.play(selSpot.sound); previewing = true; addHeard(selSpot.id); } else { sound.stop(); previewing = false; }
  renderSoundFoot();
}
function addHeard(id) {
  if (heard.has(id)) return;
  heard.add(id);
  try { localStorage.setItem('mm-heard', JSON.stringify([...heard])); } catch (e) {}
  updateCounts();
}
function renderSoundFoot() {
  $$('.node[data-id]').forEach(n => n.classList.toggle('live', previewing && selSpot && n.dataset.id === selSpot.id));
  if (!selSpot) {
    foot.innerHTML = `<div class="map-card">
      <div class="map-card-row"><div><span class="eyebrow">Sound map</span><b>Tap a circle to listen</b><span class="sub">Each part of the park sounds different</span></div>
      <button class="mini ghost" id="mcWrite"><svg><use href="#i-pen"/></svg>Write</button></div></div>`;
    $('#mcWrite').onclick = () => writeFree('map');
    return;
  }
  foot.innerHTML = `<div class="map-card${previewing ? ' on' : ''}">
    <div class="map-card-row">
      <button class="pplay" id="pvPlay" aria-label="${previewing ? 'Pause preview' : 'Play preview'}"><svg><use href="#i-${previewing ? 'pause' : 'play'}"/></svg></button>
      <div><span class="eyebrow"></span><b></b><span class="sub pv"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>${previewing ? 'Previewing' : 'Paused'}</span></div>
      <button class="mini" id="pvGo">Listen<svg><use href="#i-next"/></svg></button>
    </div></div>`;
  foot.querySelector('.eyebrow').textContent = selSpot.name;
  foot.querySelector('b').textContent = selSpot.soundName;
  $('#pvPlay').onclick = () => setPreview(!previewing);
  $('#pvGo').onclick = () => goListen(selSpot);
}
async function goListen(s) {
  if (!previewing) { sound.play(s.sound); previewing = true; addHeard(s.id); }
  layer.style.transformOrigin = `${s.x}% ${s.y}%`;
  $('#mapFoot').style.opacity = 0; $('.tabs').style.opacity = 0;
  await layer.animate([{ transform: 'scale(1)', filter: 'blur(0)' }, { transform: 'scale(3)', filter: 'blur(3px)' }],
    { duration: 650, easing: 'cubic-bezier(.55,0,.25,1)', fill: 'forwards' }).finished.catch(() => {});
  openSpot(s, true);

/* ---------- Ambient sound (Web Audio, generated live) ---------- */
const sound = (() => {
  let ctx, master, parts = [], timers = [];
  const api = { playing: false };
  function noise(kind) {
    const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0, b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'brown') { last = (last + .02 * w) / 1.02; d[i] = last * 3.5; }
      else { b0 = .99765 * b0 + w * .099; b1 = .963 * b1 + w * .2965; b2 = .57 * b2 + w * 1.0527; d[i] = (b0 + b1 + b2 + w * .1848) * .11; }
    }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; return src;
  }
  function lfo(rate, depth, target, offset) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = rate; g.gain.value = depth; o.connect(g).connect(target);
    if (offset != null) target.value = offset;
    o.start(); parts.push(o); return o;
  }
  function bed(kind, filterType, freq, q, level, mods) {
    const src = noise(kind), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = filterType; f.frequency.value = freq; f.Q.value = q; g.gain.value = level;
    src.connect(f).connect(g).connect(master); src.start(); parts.push(src);
    (mods || []).forEach(([r, depth, which]) => lfo(r, depth, which === 'f' ? f.frequency : g.gain));
  }
  function chirpSeries(level) {
    const go = () => {
      if (!api.playing) return;
      const base = 2200 + Math.random() * 1800, n = 2 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) {
        const t = ctx.currentTime + i * (.11 + Math.random() * .06);
        const o = ctx.createOscillator(), g = ctx.createGain(), p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
        o.type = 'sine';
        o.frequency.setValueAtTime(base, t);
        o.frequency.exponentialRampToValueAtTime(base * (1.25 + Math.random() * .4), t + .07);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level * .18, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + .1);
        if (p) { p.pan.value = Math.random() * 1.6 - .8; o.connect(g).connect(p).connect(master); } else o.connect(g).connect(master);
        o.start(t); o.stop(t + .12);
      }
      timers.push(setTimeout(go, 1400 + Math.random() * 4200));
    };
    timers.push(setTimeout(go, 600));
  }
  api.play = mix => {
    api.stop(true);
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(.9, ctx.currentTime + 2);
    api.playing = true;
    if (mix.wind) bed('brown', 'lowpass', 600, .7, mix.wind * .55, [[.07, 380, 'f'], [.11, mix.wind * .3, 'g']]);
    if (mix.rustle) bed('pink', 'bandpass', 1700, .6, mix.rustle * .35, [[.23, mix.rustle * .2, 'g'], [.6, 300, 'f']]);
    if (mix.leaves) bed('pink', 'bandpass', 3200, .8, mix.leaves * .45, [[.31, mix.leaves * .28, 'g'], [.77, mix.leaves * .14, 'g'], [.13, 900, 'f']]);
    if (mix.city) bed('brown', 'lowpass', 170, .5, mix.city * .8, [[.05, mix.city * .2, 'g']]);
    if (mix.birds) chirpSeries(mix.birds);
  };
  api.stop = (instant) => {
    api.playing = false;
    timers.forEach(clearTimeout); timers = [];
    if (!master) return;
    const m = master, ps = parts; parts = []; master = null;
    const end = instant ? .05 : .8;
    m.gain.cancelScheduledValues(ctx.currentTime);
    m.gain.setValueAtTime(m.gain.value, ctx.currentTime);
    m.gain.linearRampToValueAtTime(0, ctx.currentTime + end);
    setTimeout(() => { ps.forEach(p => { try { p.stop(); } catch (e) {} }); m.disconnect(); }, end * 1000 + 60);
  };
  return api;
})();

const paper = $('#paper'), pad = $('#pad'), pctx = pad.getContext('2d'), paperText = $('#paperText');

function sizePad() {

const BRUSH = {
  pencil: { w: 1.6, a: .75, comp: 'source-over' },
  pen: { w: 3, a: 1, comp: 'source-over' },
  marker: { w: 12, a: .45, comp: 'multiply' },
  eraser: { w: 22, a: 1, comp: 'destination-out' },
};
let drawingNow = false, last = null;
pad.addEventListener('pointerdown', e => { drawingNow = true; pad.setPointerCapture(e.pointerId); const r = pad.getBoundingClientRect(); last = [e.clientX - r.left, e.clientY - r.top]; stroke(last, last, e.pressure); });
pad.addEventListener('pointermove', e => { if (!drawingNow) return; const r = pad.getBoundingClientRect(), p = [e.clientX - r.left, e.clientY - r.top]; stroke(last, p, e.pressure); last = p; });
['pointerup', 'pointercancel'].forEach(ev => pad.addEventListener(ev, () => { drawingNow = false; }));
function stroke(a, b, pressure) {
  const br = BRUSH[tool]; if (!br) return;
  pctx.save();
  pctx.globalCompositeOperation = br.comp;
  pctx.globalAlpha = tool === 'pencil' ? br.a * (.7 + Math.random() * .3) : br.a;
  pctx.strokeStyle = ink; pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  const pr = pressure && pressure !== .5 ? .6 + pressure * .8 : 1;
  pctx.lineWidth = br.w * (tool === 'eraser' ? 1 : pr);
  pctx.beginPath(); pctx.moveTo(a[0], a[1]); pctx.lineTo(b[0] + .01, b[1]); pctx.stroke();
  pctx.restore();
  if (tool !== 'eraser') drawn = true;
}

$('#photoInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try { photoData = await shrinkImage(f, 720, .68); $('#reflectBg').style.backgroundImage = `url(${photoData})`; toast('Your photo is behind the paper now'); }
  catch (err) { toast('That photo could not be opened. Try another one.'); }
  e.target.value = '';
});
function shrinkImage(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}
function drawingData() {
  if (!drawn) return null;
  const r = paper.getBoundingClientRect(), c = document.createElement('canvas');
  c.width = Math.round(r.width * 1.5); c.height = Math.round(r.height * 1.5);
  c.getContext('2d').drawImage(pad, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
}

function envEl(l, w) {

  if (l) { const s = d.querySelectorAll('.env-label span'); s[0].textContent = l.spot || ''; s[1].textContent = fmtDate(l.createdAt, true); }
  return d;
}
function fmtDate(t, short) {
  const d = new Date(t);
  return short ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

async function foldAnimation() {
  $('#reflect').classList.add('sending');
  const box = $('#paperBox'), pr = paper.getBoundingClientRect(), ar = app.getBoundingClientRect();
  const w = pr.width, h = pr.height, x0 = pr.left - ar.left, y0 = pr.top - ar.top;
  const ease = (el, frames, ms, curve = 'cubic-bezier(.45,0,.2,1)') => el.animate(frames, { duration: ms, easing: curve, fill: 'forwards' }).finished.catch(() => {});

  // a still copy of the written page, split into two halves
  const copy = () => {
    const c = paper.cloneNode(true);
    c.querySelectorAll('[id]').forEach(n => n.removeAttribute('id')); c.removeAttribute('id');
    c.classList.remove('drawing');
    c.style.cssText = `position:absolute;left:0;top:0;width:${w}px;height:${h}px`;
    const ta = c.querySelector('textarea'); ta.value = paperText.value; ta.readOnly = true; ta.placeholder = ''; ta.tabIndex = -1;
    const im = new Image(); im.src = pad.toDataURL(); im.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
    c.querySelector('canvas').replaceWith(im);
    return c;
  };
  const rig = document.createElement('div'); rig.className = 'fold-rig';
  rig.style.cssText = `left:${x0}px;top:${y0}px;width:${w}px;height:${h}px`;
  rig.innerHTML = '<div class="fold-bottom"></div><div class="fold-top"><div class="face front"><i class="shade"></i></div><div class="face back"><i class="shade"></i></div></div>';
  const lower = copy(); lower.style.top = -h / 2 + 'px';
  rig.querySelector('.fold-bottom').append(lower);
  rig.querySelector('.front').prepend(copy());
  app.append(rig);
  box.style.visibility = 'hidden';

  // 1. the top half folds down over the bottom half
  const top = rig.querySelector('.fold-top');
  await Promise.all([
    ease(top, [{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(-180deg)' }], 1000),
    ease(rig.querySelector('.front .shade'), [{ opacity: 0 }, { opacity: 1 }], 500, 'ease-in'),
    ease(rig.querySelector('.back .shade'), [{ opacity: 1, offset: 0 }, { opacity: 1, offset: .5 }, { opacity: 0 }], 1000, 'ease-out'),
  ]);

  // 2. an open envelope waits below; the folded sheet lines up with its slot
  const W = Math.round(w * .92), fly = $('#fly'); fly.innerHTML = '';
  const env = envEl(null, W); env.classList.add('open'); fly.append(env);
  fly.style.left = (x0 + w / 2) + 'px'; fly.style.top = (y0 + h * .78) + 'px';
  const letterEl = env.querySelector('.env-letter');
  letterEl.style.transition = 'none'; letterEl.style.transform = 'translateY(-72%)'; letterEl.style.visibility = 'hidden';
  fly.classList.add('show');
  await sleep(40);
  const L = letterEl.getBoundingClientRect(), k = L.width / w;
  const tx = L.left - ar.left - x0, ty = L.top - ar.top - y0 - k * h / 2;
  await ease(rig, [{ transform: 'none' }, { transform: `translate(${tx}px, ${ty}px) scale(${k})` }], 700, 'cubic-bezier(.3,0,.2,1)');

  // 3. it slides into the pocket, the flap closes, the seal presses on
  letterEl.style.visibility = ''; rig.remove();
  letterEl.offsetWidth; letterEl.style.transition = '';
  letterEl.style.transform = 'translateY(0)';
  await sleep(620);
  env.classList.remove('open');
  await sleep(700);

  // 4. the envelope floats away
  await fly.animate([
    { transform: 'translate(-50%, -50%)' },
    { transform: 'translate(-50%, -50%) translateY(16px) rotate(-3deg)', offset: .25 },
    { transform: 'translate(-50%, -50%) translateY(-560px) rotate(6deg) scale(.6)', opacity: 0 }
  ], { duration: 1400, easing: 'cubic-bezier(.5,0,.3,1)' }).finished.catch(() => {});
  fly.classList.remove('show'); fly.innerHTML = '';
  box.style.visibility = '';
}

/* ---------- Archive ---------- */
function openArchive(back) { renderArchive(); show('archive', back); }
$('#archBack').onclick = () => goMap(null, true);
$('#archWrite').onclick = () => { currentSpot = null; openReflection('', FREE_PROMPTS[Math.floor(Math.random() * FREE_PROMPTS.length)], 'archive'); };
function rand(seed) { const x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }
function renderArchive() {
  const sky = $('#sky'); sky.innerHTML = '';
  $('#archCount').textContent = letters.length
    ? `${letters.length} letter${letters.length > 1 ? 's' : ''} floating here. Tap one to open it.`
    : 'Letters you write at the park will float here.';

    const e = document.createElement('div'); e.className = 'empty';
    e.append(envEl(null, 140));

    sky.append(e); updateCounts(); return;
  }
  const grid = document.createElement('div'); grid.className = 'env-grid';
  [...letters].sort((a, b) => b.createdAt - a.createdAt).forEach(l => {
    const seed = l.createdAt % 10000;
    const item = document.createElement('button');
    item.className = 'float-env' + (l.createdAt === justAdded ? ' new' : '');
    item.setAttribute('aria-label', 'Open letter from ' + l.spot + ', ' + fmtDate(l.createdAt, true));
    const env = envEl(l);
    item.style.setProperty('--d', (5 + rand(seed + 2) * 3) + 's');
    item.style.setProperty('--delay', (-rand(seed + 3) * 5) + 's');
    const cap = document.createElement('small');
    const b = document.createElement('b'); b.textContent = l.spot; cap.append(b, fmtDate(l.createdAt, true));
    item.append(env, cap);
    item.onclick = () => openLetter(l, env);

  sky.append(grid);
  justAdded = null;
  updateCounts();
}

async function openLetter(l, srcEnv) {
  const rd = $('#reader'), stage = $('#envStage'), view = $('#letterView');
  stage.innerHTML = ''; stage.style.opacity = 1; view.classList.remove('on');
  const env = envEl(l, 220); stage.append(env);

  $('#letterQ').textContent = l.question || '';

  const im = $('#letterDraw'); if (l.drawing) { im.src = l.drawing; im.hidden = false; } else { im.hidden = true; im.removeAttribute('src'); }

  await env.animate([{ transform: 'scale(.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 380, easing: 'cubic-bezier(.2,1.2,.4,1)' }).finished.catch(() => {});

  stage.style.opacity = 0; view.classList.add('on');
}
function closeLetter() {
  const rd = $('#reader');
  $('#letterView').classList.remove('on');
  setTimeout(() => { rd.classList.remove('on'); if (rd._src) rd._src.style.visibility = ''; }, 350);
}
$('#readerClose').onclick = closeLetter;
$('#readerShade').onclick = closeLetter;

/* ---------- Storage: private per-person db when available, this browser otherwise ---------- */
const store = (() => {
  const KEY = 'mm-letters';
  let col = null;
  const readLocal = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
  const writeLocal = arr => { try { localStorage.setItem(KEY, JSON.stringify(arr)); return true; } catch (e) { return false; } };
  letters = readLocal();
  const api = {
    async add(l) {
      letters = [...letters, l]; updateCounts();
      if (col) { await col.doc('l' + l.createdAt).set(l); return; }
      if (!writeLocal(letters.filter(x => !x._remote))) throw new Error('local');
    },
  };
  (async () => {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      col = db.collection('data/users/' + id);
      // move letters written before the store was ready
      const pending = readLocal();
      for (const l of pending) { await col.doc('l' + l.createdAt).set(l); }
      if (pending.length) writeLocal([]);
      col.orderBy('createdAt', 'asc').onSnapshot(snap => {
        letters = snap.docs.map(d => ({ ...d.data(), _remote: true }));
        updateCounts();
        if ($('#archive').classList.contains('on') && !$('#reader').classList.contains('on')) renderArchive();
      }, () => { col = null; });
    } catch (e) { col = null; }
  })();
  return api;
})();

/* ---------- Home: greeting + weather ---------- */
(async () => {
  try {
    const user = window.claude && window.claude.use ? await window.claude.use('user') : null;
    const me = user ? await user.me() : null;
    const raw = me && me.name ? me.name.trim().split(/\s+/)[0] : '';
    const first = raw ? raw.charAt(0).toUpperCase() + raw.slice(1) : '';
    if (first) $('#hello').textContent = `Hi, ${first}!`;
  } catch (e) {}
})();
(() => {
  // sample forecast for the widget's look; not live data
  const days = [['w-fog', 41, 30], ['w-pcloud', 45, 34], ['w-sun', 49, 36], ['w-sun', 52, 38]];
  const box = $('#wDays'), today = new Date();
  days.forEach(([icon, hi, lo], i) => {
    const d = new Date(today); d.setDate(today.getDate() + i + 1);
    const el = document.createElement('div'); el.className = 'w-day';
    el.innerHTML = `<b></b><svg><use href="#${icon}"/></svg><span>${hi}°<i>${lo}°</i></span>`;
    el.querySelector('b').textContent = d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
    box.append(el);
  });
})();
